<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Productos - Food Store Admin</title>
    <link rel="stylesheet" href="../../../style.css" />
    <style>
      .admin-layout { display: flex; min-height: 100vh; background-color: #f8f6f4; }
      .admin-sidebar {
        width: 240px; background-color: #261710; color: #fff;
        display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
      }
      .sidebar-brand { font-size: 1.3rem; font-weight: bold; color: #f97316; margin-bottom: 25px; }
      .sidebar-brand span { font-size: 0.75rem; color: #a8a29e; font-weight: normal; margin-left: 5px; }
      .sidebar-nav { display: flex; flex-direction: column; gap: 8px; }
      .sidebar-nav a {
        color: #e7e5e4; text-decoration: none; padding: 10px 14px; border-radius: 8px;
        display: flex; align-items: center; gap: 10px; font-weight: 500;
      }
      .sidebar-nav a:hover, .sidebar-nav a.active { background-color: #ea580c; color: #fff; }
      .sidebar-footer { border-top: 1px solid #44403c; padding-top: 15px; }
      .sidebar-footer p { margin: 0 0 10px 0; font-size: 0.9rem; font-weight: 600; }
      .btn-logout {
        width: 100%; padding: 8px; background: #fff; color: #1c1917;
        border: none; border-radius: 6px; font-weight: 600; cursor: pointer;
      }
      .admin-content { flex: 1; padding: 30px; overflow-x: auto; }
      .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
      .btn-primary {
        background: #ea580c; color: #fff; border: none; padding: 10px 16px;
        border-radius: 8px; font-weight: 600; cursor: pointer;
      }
      table { width: 100%; background: #fff; border-collapse: collapse; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
      th { background: #ffedd5; text-align: left; padding: 12px 14px; font-size: 0.82rem; text-transform: uppercase; color: #431407; }
      td { padding: 12px 14px; border-bottom: 1px solid #f5f5f4; vertical-align: middle; font-size: 0.92rem; }
      .thumb { width: 45px; height: 45px; object-fit: cover; border-radius: 8px; background: #f5f5f4; }
      .badge-ok { background: #dcfce7; color: #166534; padding: 3px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; }
      .badge-no { background: #fee2e2; color: #b91c1c; padding: 3px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; }
      .btn-edit { background: #f5f5f4; border: 1px solid #d6d3d1; padding: 6px 12px; border-radius: 6px; cursor: pointer; margin-right: 6px; }
      .btn-del { background: #dc2626; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
      .modal-backdrop {
        position: fixed; inset: 0; background: rgba(0,0,0,0.5);
        display: none; align-items: center; justify-content: center; z-index: 50;
      }
      .modal-box { background: #fff; padding: 25px; border-radius: 12px; width: 450px; max-width: 92%; max-height: 90vh; overflow-y: auto; }
      .modal-box label { display: block; font-weight: 600; margin: 10px 0 4px; font-size: 0.9rem; }
      .modal-box input, .modal-box textarea, .modal-box select {
        width: 100%; padding: 8px 10px; border: 1px solid #d6d3d1; border-radius: 6px; box-sizing: border-box;
      }
      .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    </style>
  </head>
  <body>
    <div class="admin-layout">
      <aside class="admin-sidebar">
        <div>
          <div class="sidebar-brand">🍔 Food Store <span>Admin</span></div>
          <nav class="sidebar-nav">
            <a href="../adminHome/home.html">📊 Dashboard</a>
            <a href="../categories/categories.html">📁 Categorías</a>
            <a href="./products.html" class="active">🍕 Productos</a>
            <a href="../orders/orders.html">📦 Pedidos</a>
            <a href="../../store/home/home.html">🏪 Ver Tienda</a>
          </nav>
        </div>
        <div class="sidebar-footer">
          <p id="admin-name">Admin</p>
          <button id="btn-logout" class="btn-logout">Cerrar sesión</button>
        </div>
      </aside>

      <main class="admin-content">
        <div class="page-header">
          <h1>Productos</h1>
          <button id="btn-new-prod" class="btn-primary">+ Nuevo producto</button>
        </div>

        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Imagen</th>
              <th>Nombre</th>
              <th>Descripción</th>
              <th>Precio</th>
              <th>Categoría</th>
              <th>Stock</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="products-tbody"></tbody>
        </table>
      </main>
    </div>

    <!-- Modal Crear / Editar Producto -->
    <div id="prod-modal" class="modal-backdrop">
      <div class="modal-box">
        <h2 id="modal-title" style="margin-top: 0;">Nuevo producto</h2>
        <form id="prod-form">
          <input type="hidden" id="prod-id" />

          <label>Nombre *</label>
          <input type="text" id="prod-nombre" required />

          <label>Descripción *</label>
          <textarea id="prod-descripcion" rows="2" required></textarea>

          <div class="row-2">
            <div>
              <label>Precio *</label>
              <input type="number" id="prod-precio" step="0.01" min="1" required />
            </div>
            <div>
              <label>Stock *</label>
              <input type="number" id="prod-stock" min="0" required />
            </div>
          </div>

          <label>Categoría *</label>
          <select id="prod-categoria" required></select>

          <label>URL de Imagen *</label>
          <input type="url" id="prod-imagen" placeholder="https://..." required />

          <label style="display: flex; align-items: center; gap: 8px; margin-top: 14px; cursor: pointer;">
            <input type="checkbox" id="prod-disponible" style="width: auto;" checked />
            Producto disponible para la venta
          </label>

          <div class="modal-actions">
            <button type="button" id="btn-cancel-modal" class="btn-edit">Cancelar</button>
            <button type="submit" class="btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="./products.ts"></script>
  </body>
</html>
