plugins {
    id 'java'
    id 'application'
}

group = 'com.tp.jpa'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17) // o 21 según el JDK que tengas instalado
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Hibernate ORM Core
    implementation 'org.hibernate.orm:hibernate-core:6.4.4.Final'

    // H2 Database
    implementation 'com.h2database:h2:2.2.224'

    // Lombok actualizado para evitar el error de TypeTag :: UNKNOWN
    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'

    // Logger
    implementation 'org.slf4j:slf4j-simple:2.0.9'
}

application {
    mainClass = 'com.tp.jpa.Main'
}